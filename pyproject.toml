[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-workspace"
version = "1.1.0"
description = "Modular multi-backend machine learning workspace for Google Colab and Linux workstations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ali Mohammadi", email = "mr.alimohammadi111@gmail.com" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20.0",
    "hf_transfer>=0.1.4",
    "pynvml>=11.5.0",
    "rich>=13.0.0",
    "gradio>=4.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "gdown>=5.0.0",
]

[project.optional-dependencies]
core = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20.0",
    "hf_transfer>=0.1.4",
    "pynvml>=11.5.0",
    "rich>=13.0.0",
    "gradio>=4.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "gdown>=5.0.0",
]
transformers = [
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "peft>=0.10.0",
]
vllm = [
    "vllm>=0.4.0",
]
diffusion = [
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
]
audio = [
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
]
unsloth = [
    "unsloth",
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "peft",
    "trl",
]
gptqmodel = [
    "gptqmodel",
    "optimum",
    "accelerate",
]
autoawq = [
    "autoawq",
    "accelerate",
]
exllamav2 = [
    "exllamav2",
]
ct2 = [
    "ctranslate2",
    "faster-whisper",
]
all = [
    "universal-ai-workspace[core,transformers,diffusion,audio]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace_core*"]
